name: Health Coach Agent

on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST  - aaj ka post banao
    - cron: "30 2 * * *"      # 08:00 IST  - na bana ho to dobara
    - cron: "30 15 * * *"     # 21:00 IST  - performance + strategy
    - cron: "*/15 2-18 * * *" # 07:30-00:15 IST har 15 min - approved posts + dashboard request
  workflow_dispatch:
    inputs:
      task:
        description: "Kya chalana hai"
        type: choice
        default: publish
        options: [publish, generate_now, performance, test, sample_video]
      script:
        description: "Video script (sirf sample_video ke liye)"
        required: false
        default: ""

concurrency:
  group: health-coach-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
      SCHEDULE: ${{ github.event.schedule }}
      CONFIG_INI: ${{ secrets.CONFIG_INI }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      SCRIPT: ${{ github.event.inputs.script }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-roboto >/dev/null
          pip install -q -r requirements.txt

      - name: Run agent
        run: python ci/run.py "${{ github.event.inputs.task || 'auto' }}"

      - name: Save state (history, performance, today's media)
        if: always()
        run: |
          git config user.name "health-coach-agent"
          git config user.email "agent@users.noreply.github.com"
          for f in posts history.json posted.json performance.json heygen_log.json; do if [ -e "$f" ]; then git add -A "$f"; fi; done
          if git diff --cached --quiet; then echo "Kuch naya nahi"; exit 0; fi
          git commit -q -m "agent: state $(date '+%d-%m %H:%M') [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
